description: >-
  FOCUS-aligned FinOps profile for DocRaptor. Billing is a flat monthly tier
  fee with included documents and a tier-specific per-document overage rate
  ($0.025–$0.12/doc). Test documents are free and unlimited (watermarked).
  Annual billing options exist on Bronze and higher.
notes: >-
  Optimisation is mostly about right-sizing the monthly tier — effective
  per-document rate decreases sharply as you climb tiers (Basic ~$0.12/doc,
  Gold ~$0.025/doc).
sources:
- https://docraptor.com/plans
