meters:
- name: plan_subscription
  description: Flat monthly DocRaptor plan fee.
  unit: month
  aggregation: sum
  dimensions:
  - account
  - tier
- name: documents_generated
  description: Production documents generated against the included monthly bundle.
  unit: document
  aggregation: sum
  dimensions:
  - account
  - format
- name: document_overage
  description: Documents above the included bundle billed at tier overage rate.
  unit: document
  aggregation: sum
  dimensions:
  - account
- name: test_documents
  description: Test (watermarked) documents (informational; not billed).
  unit: document
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Use DocRaptor account dashboard usage page; reconcile against monthly invoice.
- name: Allocation
  description: One API key per app/team; map to FOCUS ResourceTag downstream.
- name: Optimization
  description: Step up tier when overage is sustained; cache rendered PDFs server-side; use async to amortise concurrency.
- name: Accountability
  description: Assign API-key owners; alert on monthly burn-down toward bundle.
