specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: DocRaptor
providerId: docraptor
created: '2026-05-08'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-08, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-08'
reconciled: false
tags:
- Document Generation
- PDF
- HTML
- Excel
- API
- Rate Limiting
- Quotas
- Throttling
description: >-
  DocRaptor's primary throttle is the per-plan monthly document budget;
  documents above the budget are billed at the plan-specific overage rate.
  DocRaptor does not publish a per-second numeric API ceiling; concurrency
  per account is controlled via async (POST /async_docs) and Prince
  rendering capacity. 429 is returned on excess.
notes: >-
  Synchronous renders block until completion; async renders return a status
  URL for polling. Reconciled flagged false until per-second ceiling is
  publicly documented.
sources:
- https://docraptor.com/documentation
- https://docraptor.com/plans
responseCodes:
  throttled: 429
limits:
- name: Per-plan monthly documents
  scope: account
  metric: documents/month
  limit: see plan
  notes: Free 5; Basic 125; Pro 325; Premium 1,250; Max 5,000; Bronze 15,000; Silver 40,000; Gold 100,000.
- name: REST API requests
  scope: api_token
  metric: requests
  limit: see DocRaptor support
  notes: Numeric per-second ceiling not publicly documented; 429 on excess.
- name: Concurrent renders
  scope: account
  metric: concurrent
  limit: contact support
  notes: Use async_docs for high-concurrency workloads.
policies:
- name: Backoff Strategy
  description: Honor 429; use async POST /async_docs and poll the status URL.
- name: Test mode
  description: Test renders are unlimited and free but watermarked.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
