- HTML
- Excel
- API
- Plans
- Pricing
description: >-
  DocRaptor sells nine published tiers — Free, Basic, Professional, Premium,
  Max, Bronze, Silver, Gold and Enterprise — with a flat monthly fee and a
  per-document overage rate when usage exceeds the included monthly bundle.
  Test documents are unlimited and free (watermarked).
notes: >-
  Effective per-document rates range from ~$0.12 on Basic down to ~$0.025
  on Gold. Rates / counts as of 2026-05-08.
sources:
- https://docraptor.com/plans
- https://docraptor.com/documentation
